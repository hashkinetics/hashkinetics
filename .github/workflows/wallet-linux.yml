# Linux build of the desktop wallet (asked for by the first Linux user on Discord, 2026-09-05).
# Manual or on a version tag: builds `hk-wallet-gui` on Ubuntu 22.04 (glibc 2.35 — runs on anything newer),
# prints the sha256, and stores the binary as a workflow artifact. Releases stay hand-made and immutable:
# download the artifact, verify the sha in the job log, attach it to the release BEFORE publishing.
name: wallet-linux
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: system libraries (eframe/winit/glow + rustls)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libfontconfig1-dev
      - name: toolchain (chain/rust-toolchain.toml = stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chain
      - name: build
        working-directory: chain
        run: cargo build --release -p hk-wallet-gui
      - name: package + sha256
        working-directory: chain
        run: |
          V=$(grep -o 'WALLET_VERSION: &str = "[^"]*"' crates/hk-wallet-gui/src/main.rs | cut -d'"' -f2)
          cp target/release/HashKinetics-Wallet "HashKinetics-Wallet-linux-x86_64-$V"
          sha256sum "HashKinetics-Wallet-linux-x86_64-$V" | tee "HashKinetics-Wallet-linux-x86_64-$V.sha256"
          echo "WALLET_VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: HashKinetics-Wallet-linux-x86_64-${{ env.WALLET_VERSION }}
          path: |
            chain/HashKinetics-Wallet-linux-x86_64-${{ env.WALLET_VERSION }}
            chain/HashKinetics-Wallet-linux-x86_64-${{ env.WALLET_VERSION }}.sha256
          if-no-files-found: error
          retention-days: 90
