[package]
name = "hk-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hk-primitives = { path = "../hk-primitives" }
hk-crypto = { path = "../hk-crypto", features = ["mlkem"] }
# Shared statement crate — the same bytes the guests prove and the chain's pool hashes.
hk-spend-circuit = { path = "../../../zkvm-bakeoff/circuit" }
# For `pool::full_tree_path` (wallet-side path rebuild) — logic only, no node machinery.
hk-state = { path = "../hk-state" }
# Disclosure packages are serialized (JSON files handed to auditors) — P2.2.
serde = { workspace = true }
hex = { workspace = true }
# K1/K2 (v0.16.0): the HKE1 sealed-file envelope (keys at rest) — Argon2id + XChaCha20-Poly1305.
serde_json = { workspace = true }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rpassword = "7"
rand = "0.8"
zeroize = "1"

[dev-dependencies]
