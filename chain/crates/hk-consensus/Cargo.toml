[package]
name = "hk-consensus"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hk-crypto = { path = "../hk-crypto", features = ["lms", "slhdsa"] }
hk-primitives = { path = "../hk-primitives" }
bytes = { workspace = true, features = ["serde"] }
async-trait = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
tracing = "0.1"
# HK-R5.2: parallel signature verification (already in the lock transitively via SP1 —
# adding it directly costs no new crate).
rayon = "1"

# The vendored Malachite BFT engine (Apache-2.0; pinned in vendor/external/PINS.md).
# Consensus-crypto is a generic type parameter — the seam for hash-based votes later.
# Renamed (package = ...) so import paths match the engine's own convention:
malachitebft-core-types = { package = "informalsystems-malachitebft-core-types", path = "../../../vendor/external/malachite/code/crates/core-types", features = ["serde"] }
malachitebft-signing = { package = "informalsystems-malachitebft-signing", path = "../../../vendor/external/malachite/code/crates/signing" }
malachitebft-signing-ed25519 = { package = "informalsystems-malachitebft-signing-ed25519", path = "../../../vendor/external/malachite/code/crates/signing-ed25519", features = ["serde"] }

[dev-dependencies]
# RZ-1 (2026-10-22): the provider tests drive the async verify surface on a current-thread runtime.
tokio = { version = "1", features = ["rt", "sync"] }
# VZ-2 (v0.19.10, 2026-11-03): tests/r8_claims.rs drives the vendored core-consensus entry point
# (`process!`) with State<HkContext> in process — the same path the engine feeds network votes
# into — and records every Effect, so a signature check is visible as an Effect::VerifySignature.
malachitebft-core-consensus = { package = "informalsystems-malachitebft-core-consensus", path = "../../../vendor/external/malachite/code/crates/core-consensus" }
malachitebft-metrics = { package = "informalsystems-malachitebft-metrics", path = "../../../vendor/external/malachite/code/crates/metrics" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
