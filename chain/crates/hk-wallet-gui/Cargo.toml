[package]
name = "hk-wallet-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

# U3 — the desktop wallet: the whole front-door journey behind a double-click.
# Deliberately native (egui) rather than webview: one `cargo build --release`
# on Windows produces HashKinetics-Wallet.exe with no Node, no WebView2, no
# bundler config — the highest-reliability path to a shippable .exe.

[[bin]]
name = "HashKinetics-Wallet"
path = "src/main.rs"

[dependencies]
hk-primitives = { path = "../hk-primitives" }
hk-crypto = { path = "../hk-crypto", features = ["mlkem"] }
hk-state = { path = "../hk-state" }
# U3v2: the shielded side — the SAME lib the CLI wallet and every demo proved.
hk-wallet = { path = "../hk-wallet" }
hk-spend-circuit = { path = "../../../zkvm-bakeoff/circuit" }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = "0.8"
eframe = "0.28"
ureq = { version = "2.10", features = ["json"] }
