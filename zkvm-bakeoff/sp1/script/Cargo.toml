[package]
name = "hk-spend-sp1-host"
version = "0.1.0"
edition = "2021"

[dependencies]
# Must match the installed succinct toolchain era (sp1up 2026-08 → v6.x). v4 sdk pulls the
# old alloy-consensus 0.14 (broken vs modern serde) and v4 sp1-build passes flags the new
# toolchain rejects — both fixed by staying current.
sp1-sdk = { version = "6.4.0", features = ["cuda"] }
hk-spend-circuit = { path = "../../circuit" }
bincode = "1"
tokio = { version = "1", features = ["full"] }
# hk-prove server (src/bin/serve.rs): JSON over hand-rolled HTTP, hex proof transport.
serde_json = "1"
hex = "0.4"
eyre = "0.6"

[build-dependencies]
sp1-build = "6.4.0"
