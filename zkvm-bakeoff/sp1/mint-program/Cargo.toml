[package]
name = "hk-mint-program"
version = "0.1.0"
edition = "2021"

[dependencies]
# Must match the installed succinct toolchain era (sp1up 2026-08 → v6.x).
sp1-zkvm = "6.4.0"
hk-spend-circuit = { path = "../../circuit" }
# Same sha2 pin + patch as the spend program (see ../program/Cargo.toml for why).
sha2 = { version = "=0.10.8", default-features = false }

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.2.0" }
