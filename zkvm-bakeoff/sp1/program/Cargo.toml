[package]
name = "hk-spend-program"
version = "0.1.0"
edition = "2021"

[dependencies]
# Must match the installed succinct toolchain era (sp1up 2026-08 → v6.x).
sp1-zkvm = "6.4.0"
hk-spend-circuit = { path = "../../circuit" }
# Constraint dep: forces the whole guest graph to sha2 0.10.8 — the exact version the SP1
# precompile patch below provides. Without this the resolver picks 0.10.9 and the patch is
# silently ignored (observed: cycles stuck at 3,433,670; patched = 1,360,402).
sha2 = { version = "=0.10.8", default-features = false }

# ── SHA-256 acceleration via SP1 precompile ────────────────────────────────────────────────
# Routes the `sha2` crate through SP1's SHA-256 syscall inside the zkVM (identical hashes;
# normal sha2 on native targets). Tag taken from vendor/external/sp1/examples/Cargo.toml —
# the current v6-era patch. Baseline without it: 3,433,670 cycles / ~26 min WSL2 CPU prove.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.2.0" }
